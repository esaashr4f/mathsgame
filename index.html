<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1428">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lowmarsh">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Lowmarsh — an A level maths RPG</title>
  <meta name="description" content="An Undertale-style RPG where you save a fog-bound village with OCR AS Level maths — and learn to show your working.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦‍⬛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="title" class="title-screen hidden"></div>

  <div id="frame" class="hidden">
    <canvas id="game" width="384" height="288"></canvas>
    <div id="hud"></div>
    <button id="scratchBtn" title="Scratch pad: paper for your working">✏️ <span>Scratch pad</span></button>
    <div id="ui"></div>
  </div>

  <div id="touch" class="hidden" aria-hidden="true">
    <button class="fs" data-fs title="Full screen">⛶</button>
    <div class="stick"><i></i></div>
    <div class="dpad">
      <button data-k="ArrowUp" class="up">▲</button>
      <button data-k="ArrowLeft" class="left">◀</button>
      <button data-k="ArrowRight" class="right">▶</button>
      <button data-k="ArrowDown" class="down">▼</button>
    </div>
    <div class="abtn">
      <button data-k="r" class="r">🐦</button>
      <button data-k="c" class="b">☰</button>
      <button data-k="z" class="a">A</button>
    </div>
  </div>

  <div id="screens"></div>
  <div id="fader"></div>

  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/math.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine/graph.js"></script>
  <script src="js/engine/sprites.js"></script>
  <script src="js/engine/tiles.js"></script>
  <script src="js/engine/ui.js"></script>
  <script src="js/engine/world.js"></script>
  <script src="js/engine/solver.js"></script>
  <script src="js/engine/battle.js"></script>
  <script src="js/engine/titlescreen.js"></script>
  <script src="js/data/topics.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/papers.js"></script>
  <script src="js/data/papers2.js"></script>
  <script src="js/data/papers3.js"></script>
  <script src="js/story/cast.js"></script>
  <script src="js/story/maps.js"></script>
  <script src="js/story/ch1.js"></script>
  <script src="js/story/ch2.js"></script>
  <script src="js/story/ch3.js"></script>
  <script src="js/story/ch4.js"></script>
  <script src="js/story/ch5.js"></script>
  <script src="js/story/finale.js"></script>
  <script src="js/story/sides.js"></script>
  <script src="js/story/guide.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
